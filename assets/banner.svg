<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#13111c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="fade" cx="0.72" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
    <style>
      .glow1 { animation: drift1 14s ease-in-out infinite alternate; }
      .glow2 { animation: drift2 18s ease-in-out infinite alternate; }
      .orbit { transform-origin: 930px 160px; animation: spin 30s linear infinite; }
      .orbit2 { transform-origin: 930px 160px; animation: spin 46s linear infinite reverse; }
      @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(-60px,20px); } }
      @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(50px,-25px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle class="glow1" cx="960" cy="120" r="170" fill="#7c3aed" fill-opacity="0.38" filter="url(#blur)"/>
    <circle class="glow2" cx="780" cy="300" r="140" fill="#2563eb" fill-opacity="0.22" filter="url(#blur)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#dotmask)"/>

    <!-- orbits -->
    <circle cx="930" cy="160" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="930" cy="160" r="115" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-dasharray="2 7"/>
    <circle cx="930" cy="160" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    <g class="orbit"><circle cx="1000" cy="160" r="4" fill="#c4b5fd"/></g>
    <g class="orbit2"><circle cx="930" cy="45" r="3" fill="#93c5fd"/></g>
    <circle cx="930" cy="160" r="9" fill="#a78bfa"/>
    <circle cx="930" cy="160" r="22" fill="#a78bfa" fill-opacity="0.15"/>

    <!-- text -->
    <text x="80" y="172" font-size="76" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Reynard</text>
    <text x="84" y="218" font-size="23" fill="#8b949e">Developer</text>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
